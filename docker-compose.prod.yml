# استخدم هذا الملف على السيرفر: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  app:
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

  web:
    ports:
      - "80:80"

  # عامل الطوابير (Queue) للإنتاج
  queue:
    image: hr-hospital-app
    container_name: hr-hospital-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --sleep=3
    env_file: .env
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - CACHE_STORE=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=database
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hr-network
